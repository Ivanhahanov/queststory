<svg width="192" height="192" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome silhouette for Android's status-bar notification badge — the
       OS recolors this using its alpha channel only, so it must be a solid
       shape on a fully transparent background (no gradients/colors kept). -->
  <g transform="translate(256 256)" fill="#ffffff">
    <rect x="-96" y="-136" width="192" height="272" rx="26"/>
  </g>
</svg>
